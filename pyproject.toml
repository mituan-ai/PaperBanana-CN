[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperbanana-cn"
version = "2.0.1"
description = "PaperBanana-CN academic illustration with independent model connections"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "mituan" },
]
keywords = ["academic", "illustration", "diagram", "paper", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "google-genai>=1.65,<3.0",
    "openai>=1.0,<3.0",
    "gradio==6.20.0",
    "fastmcp>=3.4,<4.0",
    "pymupdf>=1.24,<2.0",
    "pillow>=10.0",
    "typer>=0.12,<0.26",
    "click>=8.1,<8.5",
    "rich>=13.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "tenacity>=8.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.83"]
litellm = ["litellm>=1.67.0,<2.0"]
all-providers = [
    "boto3>=1.34",
    "anthropic>=0.83",
    "litellm>=1.67.0,<2.0",
]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "twine>=6.0",
    "nbformat>=5.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "playwright>=1.48",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mituan-ai/PaperBanana-CN"
Repository = "https://github.com/mituan-ai/PaperBanana-CN"
Issues = "https://github.com/mituan-ai/PaperBanana-CN/issues"

[project.scripts]
paperbanana-cn = "paperbanana_cn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["paperbanana_cn", "mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"
"data" = "data"
"configs" = "configs"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["studio_e2e: desktop browser regression tests for PaperBanana Studio"]
