# PaperBanana upstream-compatible legacy configuration.
# Provider fields require explicit --legacy-connections mode.
# Profile mode may reuse non-connection sections after removing vlm/image fields.

# Provider settings
vlm:
  provider: gemini
  model: gemini-2.5-flash

image:
  provider: google_imagen
  model: gemini-3-pro-image-preview
  quality: auto

# Pipeline settings
pipeline:
  num_retrieval_examples: 10
  refinement_iterations: 3
  # auto_refine: true         # Loop until critic is satisfied
  # max_iterations: 30        # Safety cap for auto_refine mode
  # optimize_inputs: true     # Preprocess inputs for better generation
  output_resolution: "2k"   # 1k, 2k, 4k
  diagram_type: methodology  # methodology, statistical_plot
  # venue: neurips          # Venue style pack: built-in (neurips, icml, acl, ieee),
  #                         # a user pack name (see `paperbanana-cn venues list`), or custom
  # venue_dir: ~/.config/paperbanana-cn/venues  # User venue pack directory override

# Reference set
reference:
  path: data/reference_sets
  guidelines_path: data/guidelines

# Output settings
output:
  dir: outputs
  save_iterations: true
  save_prompts: true
  save_metadata: true

# Logging
logging:
  level: INFO
  format: json
