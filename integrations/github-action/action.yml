name: "PaperBanana-CN Figure"
description: >-
  Generate a publication-quality methodology diagram with independent VLM and
  image connections, then optionally commit it to the repository.
author: "mituan"
branding:
  icon: "image"
  color: "green"

inputs:
  tex-file:
    description: "Path to the .tex file containing the methodology section"
    required: true
  section:
    description: "Section title to extract (case-insensitive substring match)"
    required: false
    default: "Method"
  caption:
    description: "Figure caption or communicative intent"
    required: true
  output-path:
    description: "Repo-relative output image path (.png, .jpg, or .jpeg)"
    required: false
    default: "figures/method_overview.png"
  snippet-path:
    description: "Repo-relative LaTeX snippet path (defaults to output-path with .tex)"
    required: false
    default: ""
  figure-label:
    description: "LaTeX label for the generated figure"
    required: false
    default: "fig:method-overview"
  figure-width:
    description: "Width argument for LaTeX includegraphics"
    required: false
    default: '\columnwidth'
  vlm-provider:
    description: "VLM provider adapter"
    required: false
    default: "openai"
  vlm-base-url:
    description: "VLM API base URL; leave empty for the provider default"
    required: false
    default: ""
  vlm-model:
    description: "Exact VLM model identifier"
    required: true
  vlm-api-key:
    description: "VLM API key; pass a GitHub Actions secret"
    required: true
  image-provider:
    description: "Image generation provider adapter"
    required: false
    default: "openai_imagen"
  image-base-url:
    description: "Image API base URL; leave empty for the provider default"
    required: false
    default: ""
  image-model:
    description: "Exact image model identifier"
    required: true
  image-api-key:
    description: "Image API key; pass a GitHub Actions secret"
    required: true
  image-size-mode:
    description: "Image protocol: fixed, explicit_pixels, native_tier, or prompt_hint"
    required: false
    default: "fixed"
  aspect-ratio:
    description: "Output aspect ratio"
    required: false
    default: "3:2"
  resolution:
    description: "Output resolution tier: 1K, 2K, or 4K"
    required: false
    default: "1K"
  iterations:
    description: "Visualizer/Critic refinement iterations"
    required: false
    default: "3"
  optimize:
    description: "Preprocess inputs for better generation"
    required: false
    default: "false"
  budget:
    description: "Optional budget cap in USD"
    required: false
    default: ""
  seed:
    description: "Optional random seed"
    required: false
    default: ""
  paperbanana-version:
    description: "Exact paperbanana-cn version to install"
    required: false
    default: "2.0.1"
  commit:
    description: "Commit and push the generated files"
    required: false
    default: "true"
  commit-message:
    description: "Commit message; keep [skip ci] to prevent loops"
    required: false
    default: "chore: update figure via PaperBanana-CN [skip ci]"

outputs:
  image-path:
    description: "Repo-relative path of the generated image"
    value: ${{ steps.generate.outputs.image-path }}
  snippet-path:
    description: "Repo-relative path of the generated LaTeX snippet"
    value: ${{ steps.snippet.outputs.snippet-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install PaperBanana-CN
      shell: bash
      env:
        PB_VERSION: ${{ inputs.paperbanana-version }}
      run: python -m pip install --quiet "paperbanana-cn==${PB_VERSION}"

    - name: Extract methodology section
      shell: bash
      env:
        TEX_FILE: ${{ inputs.tex-file }}
        SECTION: ${{ inputs.section }}
      run: |
        python "${{ github.action_path }}/extract_section.py" \
          --tex "$TEX_FILE" \
          --section "$SECTION" \
          --out "$RUNNER_TEMP/paperbanana-cn-methodology.txt"

    - name: Configure independent model connections
      shell: bash
      env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/paperbanana-cn/config
        XDG_DATA_HOME: ${{ runner.temp }}/paperbanana-cn/data
        XDG_CACHE_HOME: ${{ runner.temp }}/paperbanana-cn/cache
        PB_VLM_PROVIDER: ${{ inputs.vlm-provider }}
        PB_VLM_BASE_URL: ${{ inputs.vlm-base-url }}
        PB_VLM_MODEL: ${{ inputs.vlm-model }}
        PB_VLM_API_KEY: ${{ inputs.vlm-api-key }}
        PB_IMAGE_PROVIDER: ${{ inputs.image-provider }}
        PB_IMAGE_BASE_URL: ${{ inputs.image-base-url }}
        PB_IMAGE_MODEL: ${{ inputs.image-model }}
        PB_IMAGE_API_KEY: ${{ inputs.image-api-key }}
        PB_IMAGE_SIZE_MODE: ${{ inputs.image-size-mode }}
      run: python "${{ github.action_path }}/configure_connections.py"

    - name: Generate figure
      id: generate
      shell: bash
      env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/paperbanana-cn/config
        XDG_DATA_HOME: ${{ runner.temp }}/paperbanana-cn/data
        XDG_CACHE_HOME: ${{ runner.temp }}/paperbanana-cn/cache
        CAPTION: ${{ inputs.caption }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        ASPECT_RATIO: ${{ inputs.aspect-ratio }}
        RESOLUTION: ${{ inputs.resolution }}
        ITERATIONS: ${{ inputs.iterations }}
        OPTIMIZE: ${{ inputs.optimize }}
        BUDGET: ${{ inputs.budget }}
        SEED: ${{ inputs.seed }}
      run: |
        set -euo pipefail
        case "${OUTPUT_PATH##*.}" in
          png) FORMAT="png" ;;
          jpg|jpeg) FORMAT="jpeg" ;;
          *) echo "error: output-path must end in .png, .jpg, or .jpeg"; exit 1 ;;
        esac

        ARGS=(
          --input "$RUNNER_TEMP/paperbanana-cn-methodology.txt"
          --caption "$CAPTION"
          --output-dir "$RUNNER_TEMP/paperbanana-cn-output"
          --format "$FORMAT"
          --aspect-ratio "$ASPECT_RATIO"
          --resolution "$RESOLUTION"
          --iterations "$ITERATIONS"
        )
        [ "$OPTIMIZE" = "true" ] && ARGS+=(--optimize)
        [ -n "$BUDGET" ] && ARGS+=(--budget "$BUDGET")
        [ -n "$SEED" ] && ARGS+=(--seed "$SEED")

        "${PAPERBANANA_CN_COMMAND:-paperbanana-cn}" generate "${ARGS[@]}"

        IMG=$(find "$RUNNER_TEMP/paperbanana-cn-output" -type f \
          \( -name 'final_output.png' -o -name 'final_output.jpg' \) \
          -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
        if [ -z "$IMG" ]; then
          echo "error: no final output image produced"
          exit 1
        fi
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        cp "$IMG" "$OUTPUT_PATH"
        echo "image-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

    - name: Write LaTeX snippet
      id: snippet
      shell: bash
      env:
        CAPTION: ${{ inputs.caption }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        SNIPPET_PATH: ${{ inputs.snippet-path }}
        FIGURE_LABEL: ${{ inputs.figure-label }}
        FIGURE_WIDTH: ${{ inputs.figure-width }}
      run: |
        python - <<'PYEOF'
        import os
        from pathlib import Path

        output_path = os.environ["OUTPUT_PATH"]
        snippet_path = os.environ["SNIPPET_PATH"] or str(Path(output_path).with_suffix(".tex"))
        snippet = "\n".join(
            [
                "% Generated by PaperBanana-CN (https://github.com/mituan-ai/PaperBanana-CN)",
                f"% Usage: \\input{{{Path(snippet_path).with_suffix('')}}}",
                "\\begin{figure}[t]",
                "  \\centering",
                f"  \\includegraphics[width={os.environ['FIGURE_WIDTH']}]{{{output_path}}}",
                f"  \\caption{{{os.environ['CAPTION']}}}",
                f"  \\label{{{os.environ['FIGURE_LABEL']}}}",
                "\\end{figure}",
                "",
            ]
        )
        Path(snippet_path).parent.mkdir(parents=True, exist_ok=True)
        Path(snippet_path).write_text(snippet, encoding="utf-8")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"snippet-path={snippet_path}\n")
        PYEOF

    - name: Commit and push
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      env:
        IMAGE_PATH: ${{ steps.generate.outputs.image-path }}
        SNIPPET_PATH: ${{ steps.snippet.outputs.snippet-path }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$IMAGE_PATH" "$SNIPPET_PATH"
        if git diff --cached --quiet; then
          echo "Figure unchanged; nothing to commit."
        else
          git commit -m "$COMMIT_MESSAGE"
          git push
        fi
