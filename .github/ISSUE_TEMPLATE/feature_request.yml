name: Feature request
description: Propose a scoped PaperBanana-CN improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: product-area
    attributes:
      label: Product area
      options:
        - Independent VLM/image connections
        - Chinese or English Studio
        - Aspect ratio or resolution
        - Packaging, MCP, Action, or Docker
        - Upstream workflow change
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the current workflow and the concrete limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-visible behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Existing capability to reuse
      description: Identify an upstream adapter, setting, size control, or workflow that can be extended.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require a second configuration or provider creation path.
          required: true
        - label: I have checked whether the change belongs in upstream PaperBanana first.
          required: true
