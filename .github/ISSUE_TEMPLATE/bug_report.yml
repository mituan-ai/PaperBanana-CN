name: Bug report
description: Report a reproducible PaperBanana-CN problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, credential-bearing URLs, unpublished paper text, and private data.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - VLM connection
        - Image connection
        - Chinese or English Studio
        - Aspect ratio or resolution
        - CLI or MCP
        - Upstream generation workflow
        - Packaging, Action, or Docker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Do not include API keys, private URLs, papers, or datasets.
      render: text
  - type: input
    id: version
    attributes:
      label: PaperBanana-CN version
      placeholder: "paperbanana-cn 2.0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, OS, and installation method
      placeholder: "Python 3.12, Ubuntu 24.04, pip"
    validations:
      required: true
