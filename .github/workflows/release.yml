name: Release PaperBanana-CN

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'mituan-ai/PaperBanana-CN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install release dependencies
        run: pip install -e ".[dev]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Verify tag, package, manifest, and release-note versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag_name = os.environ["RELEASE_TAG"]
          version = tag_name.removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          namespace = {}
          exec(open("paperbanana_cn/__init__.py", encoding="utf-8").read(), namespace)
          manifest = json.load(open("server.json", encoding="utf-8"))
          versions = {
              "tag": version,
              "pyproject": project["version"],
              "__init__": namespace["__version__"],
              "server.json": manifest["version"],
              "MCP package": manifest["packages"][0]["version"],
          }
          print(versions)
          if len(set(versions.values())) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          if project["name"] != "paperbanana-cn":
              raise SystemExit(f"unexpected distribution name: {project['name']}")
          notes = Path("docs/releases") / f"{tag_name}.md"
          if not notes.is_file():
              raise SystemExit(f"missing release notes: {notes}")
          PY
      - name: Run test, static-analysis, and README gates
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: |
          pytest tests/ -q
          ruff check paperbanana_cn/ mcp_server/ tests/ scripts/
          ruff format --check paperbanana_cn/ mcp_server/ tests/ scripts/
          python scripts/check_readme_release.py
      - name: Build reproducible release archives once
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution_archive.py --dist-dir dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify clean wheel, unique command, and MCP handshake
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/paperbanana-cn-release
          /tmp/paperbanana-cn-release/bin/pip install dist/*.whl
          /tmp/paperbanana-cn-release/bin/paperbanana-cn --version
          /tmp/paperbanana-cn-release/bin/python - <<'PY'
          import importlib.util
          import importlib.metadata
          import os
          import sys
          from pathlib import Path

          import paperbanana_cn

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          assert paperbanana_cn.__version__ == version
          assert importlib.util.find_spec("paperbanana") is None
          scripts = Path(sys.executable).parent
          forbidden = ("paperbanana", "paperbanana.exe", "paperbanana-mcp", "paperbanana-mcp.exe")
          assert all(not (scripts / name).exists() for name in forbidden)
          commands = {
              entry.name
              for entry in importlib.metadata.distribution("paperbanana-cn").entry_points
              if entry.group == "console_scripts"
          }
          assert commands == {"paperbanana-cn"}
          PY
          /tmp/paperbanana-cn-release/bin/python scripts/smoke_mcp.py \
            --command /tmp/paperbanana-cn-release/bin/paperbanana-cn
      - name: Validate MCP Registry manifest with pinned publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  /tmp/mcp-publisher.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate
      - name: Build and smoke-test the production image locally
        env:
          IMAGE_TAG: paperbanana-cn:${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_TAG" .
          docker run --rm "$IMAGE_TAG" --version | grep -F "${RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: paperbanana-cn-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: paperbanana-cn-${{ github.ref_name }}
          path: dist
      - name: Reject conflicting PyPI versions
        id: pypi
        run: >-
          python scripts/verify_pypi_release.py
          --project paperbanana-cn
          --version "${GITHUB_REF_NAME#v}"
          --dist-dir dist
      - name: Keep only Python distributions in the upload directory
        if: steps.pypi.outputs.publish == 'true'
        run: rm dist/SHA256SUMS
      - name: Publish wheel and sdist with Trusted Publishing
        if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi-install:
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install the public PyPI release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in {1..18}; do
            if python -m pip install "paperbanana-cn==${RELEASE_VERSION#v}"; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "PyPI release did not become installable in time"
              exit 1
            fi
            sleep 10
          done
      - name: Verify command, namespace, and eleven MCP tools
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          paperbanana-cn --version | grep -F "${RELEASE_VERSION#v}"
          python - <<'PY'
          import importlib.util
          import importlib.metadata
          import os
          import sys
          from pathlib import Path

          import paperbanana_cn

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          assert paperbanana_cn.__version__ == version
          assert importlib.util.find_spec("paperbanana") is None
          scripts = Path(sys.executable).parent
          forbidden = ("paperbanana", "paperbanana.exe", "paperbanana-mcp", "paperbanana-mcp.exe")
          assert all(not (scripts / name).exists() for name in forbidden)
          commands = {
              entry.name
              for entry in importlib.metadata.distribution("paperbanana-cn").entry_points
              if entry.group == "console_scripts"
          }
          assert commands == {"paperbanana-cn"}
          PY
          python scripts/smoke_mcp.py --command paperbanana-cn

  publish-mcp:
    needs: verify-pypi-install
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned MCP publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  /tmp/mcp-publisher.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
      - name: Reject conflicting MCP Registry versions
        id: registry
        run: python scripts/verify_mcp_release.py --manifest server.json
      - name: Publish to the MCP Registry with GitHub OIDC
        if: steps.registry.outputs.publish == 'true'
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish

  publish-docker:
    needs: verify-pypi-install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect an existing immutable version tag
        id: image
        env:
          IMAGE: ghcr.io/mituan-ai/paperbanana-cn:${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; it will be verified, not overwritten."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: metadata
        if: steps.image.outputs.exists != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mituan-ai/paperbanana-cn
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build and publish amd64/arm64 images with attestations
        id: build
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Verify platforms, revision, SBOM, provenance, and execution
        env:
          IMAGE: ghcr.io/mituan-ai/paperbanana-cn:${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          for attempt in {1..18}; do
            if docker buildx imagetools inspect --raw "$IMAGE" > /tmp/index.json; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Published image did not become visible in time"
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json

          manifest = json.load(open("/tmp/index.json", encoding="utf-8"))
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}"
              for item in manifest.get("manifests", [])
          }
          required = {"linux/amd64", "linux/arm64"}
          if not required <= platforms:
              raise SystemExit(f"missing image platforms: {sorted(required - platforms)}")
          attestations = [
              item["digest"]
              for item in manifest["manifests"]
              if item["platform"]["os"] == "unknown"
          ]
          if len(attestations) < 2:
              raise SystemExit("expected attestation manifests for both image platforms")
          open("/tmp/attestation-digests", "w", encoding="utf-8").write(
              "\n".join(attestations)
          )
          PY
          : > /tmp/attestations.jsonl
          while read -r digest; do
            docker buildx imagetools inspect --raw "$IMAGE@$digest" \
              >> /tmp/attestations.jsonl
            echo >> /tmp/attestations.jsonl
          done < /tmp/attestation-digests
          grep -F "https://spdx.dev/Document" /tmp/attestations.jsonl
          grep -F "https://slsa.dev/provenance/" /tmp/attestations.jsonl
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE"
            test "$(docker image inspect \
              --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$IMAGE")" = "$GITHUB_SHA"
            docker run --rm --platform "$platform" "$IMAGE" --version \
              | grep -F "${RELEASE_VERSION#v}"
            docker image rm "$IMAGE"
          done

  github-release:
    needs: [publish-pypi, verify-pypi-install, publish-mcp, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: paperbanana-cn-${{ github.ref_name }}
          path: dist
      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p /tmp/existing-release
            gh release download "$GITHUB_REF_NAME" --dir /tmp/existing-release
            cmp dist/SHA256SUMS /tmp/existing-release/SHA256SUMS
            (cd /tmp/existing-release && sha256sum -c SHA256SUMS)
            cmp dist/*.whl /tmp/existing-release/*.whl
            cmp dist/*.tar.gz /tmp/existing-release/*.tar.gz
            echo "Existing GitHub Release artifacts are byte-identical."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "PaperBanana-CN ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          fi

  release-audit:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7
        with:
          name: paperbanana-cn-${{ github.ref_name }}
          path: dist
      - name: Verify public PyPI artifacts are byte-identical
        run: |
          python scripts/verify_pypi_release.py \
            --project paperbanana-cn \
            --version "${GITHUB_REF_NAME#v}" \
            --dist-dir dist | tee /tmp/pypi-audit
          grep -F "publish=false" /tmp/pypi-audit
      - name: Verify MCP Registry metadata is identical
        run: |
          for attempt in {1..18}; do
            python scripts/verify_mcp_release.py --manifest server.json \
              | tee /tmp/mcp-audit
            if grep -F "publish=false" /tmp/mcp-audit; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "MCP Registry release did not become visible in time"
              exit 1
            fi
            sleep 10
          done
      - name: Verify GitHub Release hashes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/github-release
          gh release download "$GITHUB_REF_NAME" --dir /tmp/github-release
          cmp dist/SHA256SUMS /tmp/github-release/SHA256SUMS
          cmp dist/*.whl /tmp/github-release/*.whl
          cmp dist/*.tar.gz /tmp/github-release/*.tar.gz
          (cd /tmp/github-release && sha256sum -c SHA256SUMS)
      - name: Verify README assets, badges, PyPI, Action, and Colab links
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install pillow
          python scripts/check_readme_release.py --online
          curl -fsSL \
            "https://raw.githubusercontent.com/mituan-ai/PaperBanana-CN/${GITHUB_REF_NAME}/integrations/github-action/action.yml" \
            | grep -F "default: \"${RELEASE_VERSION#v}\""
          curl -fsSL \
            "https://raw.githubusercontent.com/mituan-ai/PaperBanana-CN/${GITHUB_REF_NAME}/notebooks/PaperBanana_CN_Quickstart.ipynb" \
            | grep -F "paperbanana-cn==${RELEASE_VERSION#v}"
      - name: Verify GHCR is publicly pullable and executable
        env:
          IMAGE: ghcr.io/mituan-ai/paperbanana-cn:${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          docker logout ghcr.io || true
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" --version \
            | grep -F "${RELEASE_VERSION#v}"
