<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="title desc">
  <title id="title">PaperBanana-CN V1 与 V2 演进关系</title>
  <desc id="desc">V1 作为冻结版本永久保留，V2 在 main 分支持续维护，并继续复用上游科研生图工作流。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3CB894"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="16" fill="#151A18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="52" y="48" fill="#91A09A" font-size="18" font-weight="700">项目版本谱系</text>
    <path d="M110 145H1060" stroke="#48534F" stroke-width="4"/>
    <path d="M548 145H750" stroke="#3CB894" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="226" cy="145" r="14" fill="#A87418"/>
    <circle cx="868" cy="145" r="14" fill="#3CB894"/>

    <text x="104" y="100" fill="#FFFFFF" font-size="31" font-weight="750">V1 · 永久冻结</text>
    <text x="104" y="183" fill="#C7D0CC" font-size="20">保留独立分支和 v1.0.0 Release</text>

    <text x="788" y="100" fill="#FFFFFF" font-size="31" font-weight="750">V2 · main</text>
    <text x="788" y="183" fill="#C7D0CC" font-size="20">独立包名、命令与完整产品体验</text>

    <rect x="438" y="205" width="324" height="30" rx="15" fill="#203B34"/>
    <text x="600" y="226" fill="#BCE8DB" font-size="17" font-weight="700" text-anchor="middle">继续复用上游科研生图工作流</text>
  </g>
</svg>
