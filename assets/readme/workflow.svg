<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">Two model connections feeding one scientific figure workflow</title>
  <desc id="desc">The VLM and image services keep separate protocol, URL, key, and model settings while the existing PaperBanana pipeline coordinates planning, generation, critique, and refinement.</desc>

  <defs>
    <marker id="workflow-arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#147862"/>
    </marker>
    <marker id="workflow-arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#A87418"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="16" fill="#F6F8F7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="56" fill="#18211E" font-size="34" font-weight="760">One pipeline. Two independent model rails.</text>
    <text x="54" y="87" fill="#52605B" font-size="18">Use official APIs or compatible relays without coupling the VLM and image settings.</text>

    <g id="connections">
      <rect x="54" y="128" width="264" height="88" rx="7" fill="#FFFFFF" stroke="#147862" stroke-width="2"/>
      <circle cx="78" cy="157" r="7" fill="#147862"/>
      <text x="96" y="164" fill="#18211E" font-size="22" font-weight="720">VLM connection</text>
      <text x="78" y="194" fill="#52605B" font-size="18">Protocol · URL · Key · Model</text>

      <rect x="54" y="246" width="264" height="88" rx="7" fill="#FFFFFF" stroke="#A87418" stroke-width="2"/>
      <circle cx="78" cy="275" r="7" fill="#A87418"/>
      <text x="96" y="282" fill="#18211E" font-size="22" font-weight="720">Image connection</text>
      <text x="78" y="312" fill="#52605B" font-size="18">Protocol · URL · Key · Model</text>
    </g>

    <g id="pipeline">
      <rect x="366" y="116" width="770" height="230" rx="9" fill="#FFFFFF" stroke="#CBD4CF"/>

      <text x="396" y="151" fill="#147862" font-size="18" font-weight="720">VLM RAIL</text>
      <path d="M318 172H388" fill="none" stroke="#147862" stroke-width="3" marker-end="url(#workflow-arrow-green)"/>
      <path d="M396 172H890" fill="none" stroke="#147862" stroke-width="3"/>
      <rect x="416" y="188" width="130" height="48" rx="6" fill="#DCECE7"/>
      <text x="446" y="219" fill="#18211E" font-size="19" font-weight="650">Understand</text>
      <rect x="570" y="188" width="112" height="48" rx="6" fill="#DCECE7"/>
      <text x="605" y="219" fill="#18211E" font-size="19" font-weight="650">Plan</text>
      <rect x="706" y="188" width="122" height="48" rx="6" fill="#DCECE7"/>
      <text x="733" y="219" fill="#18211E" font-size="19" font-weight="650">Critique</text>
      <path d="M481 172V188M626 172V188M767 172V188" stroke="#147862" stroke-width="3"/>

      <text x="396" y="271" fill="#A87418" font-size="18" font-weight="720">IMAGE RAIL</text>
      <path d="M318 290H388" fill="none" stroke="#A87418" stroke-width="3" marker-end="url(#workflow-arrow-gold)"/>
      <path d="M396 290H890" fill="none" stroke="#A87418" stroke-width="3"/>
      <rect x="493" y="258" width="130" height="48" rx="6" fill="#F3E5C6"/>
      <text x="522" y="289" fill="#18211E" font-size="19" font-weight="650">Generate</text>
      <rect x="650" y="258" width="112" height="48" rx="6" fill="#F3E5C6"/>
      <text x="680" y="289" fill="#18211E" font-size="19" font-weight="650">Refine</text>

      <path d="M890 172H914V223" fill="none" stroke="#147862" stroke-width="3"/>
      <path d="M890 290H914V241" fill="none" stroke="#A87418" stroke-width="3"/>
      <path d="M914 232H940" stroke="#18211E" stroke-width="3" marker-end="url(#workflow-arrow-green)"/>

      <rect x="958" y="151" width="150" height="158" rx="7" fill="#F6F8F7" stroke="#18211E" stroke-width="2"/>
      <text x="978" y="181" fill="#18211E" font-size="17" font-weight="720">FINAL FIGURE</text>
      <rect x="979" y="198" width="108" height="50" rx="4" fill="#FFFFFF" stroke="#CBD4CF"/>
      <path d="M994 223H1025M1037 211H1071M1037 232H1071" stroke="#147862" stroke-width="4"/>
      <text x="981" y="273" fill="#52605B" font-size="17">16:9 · 2K</text>
      <text x="981" y="296" fill="#52605B" font-size="17">PNG / SVG / PDF</text>
    </g>
  </g>
</svg>
