<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="title desc">
  <title id="title">PaperBanana-CN V1 and V2 lineage</title>
  <desc id="desc">V1 is preserved as a frozen release while V2 is maintained on main and continues to reuse the upstream scientific figure workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3CB894"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="16" fill="#151A18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="48" fill="#91A09A" font-size="18" font-weight="700">PROJECT LINEAGE</text>
    <path d="M110 145H1060" stroke="#48534F" stroke-width="4"/>
    <path d="M548 145H750" stroke="#3CB894" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="226" cy="145" r="14" fill="#A87418"/>
    <circle cx="868" cy="145" r="14" fill="#3CB894"/>

    <text x="104" y="100" fill="#FFFFFF" font-size="31" font-weight="750">V1 · frozen</text>
    <text x="104" y="183" fill="#C7D0CC" font-size="20">Preserved branch and v1.0.0 release</text>

    <text x="788" y="100" fill="#FFFFFF" font-size="31" font-weight="750">V2 · main</text>
    <text x="788" y="183" fill="#C7D0CC" font-size="20">Independent package, CLI, and product UX</text>

    <rect x="438" y="205" width="324" height="30" rx="15" fill="#203B34"/>
    <text x="600" y="226" fill="#BCE8DB" font-size="17" font-weight="700" text-anchor="middle">UPSTREAM SCIENTIFIC WORKFLOW RETAINED</text>
  </g>
</svg>
