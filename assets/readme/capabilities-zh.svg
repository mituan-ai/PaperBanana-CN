<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">PaperBanana-CN 三项核心能力</title>
  <desc id="desc">视觉语言模型与图像模型独立连接、中英文工作台，以及准确的宽高比和分辨率控制。</desc>

  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#147862"/>
    </marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#A87418"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="18" fill="#EEF1F0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="48" y="48" fill="#52605B" font-size="18" font-weight="700">V2 真正新增的三项产品能力</text>

    <g id="dual-connections">
      <rect x="48" y="72" width="650" height="400" rx="10" fill="#151A18"/>
      <text x="84" y="119" fill="#8FD8C4" font-size="18" font-weight="700">01 / 两条独立模型链路</text>
      <text x="84" y="165" fill="#FFFFFF" font-size="34" font-weight="750">两个角色，各自按需连接。</text>
      <text x="84" y="199" fill="#C7D0CC" font-size="20">协议、URL、密钥、模型和超时完全独立。</text>

      <rect x="84" y="244" width="220" height="92" rx="7" fill="#203B34" stroke="#318A72"/>
      <circle cx="111" cy="272" r="7" fill="#3CB894"/>
      <text x="132" y="280" fill="#FFFFFF" font-size="23" font-weight="700">VLM</text>
      <text x="108" y="314" fill="#C7D0CC" font-size="19">兼容 OpenAI / Gemini 协议</text>

      <rect x="84" y="360" width="220" height="76" rx="7" fill="#332D20" stroke="#8A6D30"/>
      <circle cx="111" cy="388" r="7" fill="#D6A84F"/>
      <text x="132" y="396" fill="#FFFFFF" font-size="23" font-weight="700">图像生成</text>
      <text x="108" y="421" fill="#E0D3B5" font-size="18">原生档位或显式像素</text>

      <path d="M304 290H365V319H408" fill="none" stroke="#3CB894" stroke-width="4" marker-end="url(#arrow-green)"/>
      <path d="M304 398H365V349H408" fill="none" stroke="#D6A84F" stroke-width="4" marker-end="url(#arrow-gold)"/>

      <rect x="426" y="262" width="224" height="142" rx="8" fill="#F6F8F7"/>
      <text x="456" y="296" fill="#52605B" font-size="18" font-weight="700">同一条科研生图流程</text>
      <rect x="456" y="320" width="60" height="34" rx="4" fill="#DCECE7"/>
      <rect x="527" y="320" width="54" height="34" rx="4" fill="#F3E5C6"/>
      <path d="M516 337H527M581 337H608" stroke="#18211E" stroke-width="3"/>
      <circle cx="615" cy="337" r="8" fill="#147862"/>
      <path d="M615 345V368H478" fill="none" stroke="#18211E" stroke-width="3"/>
      <circle cx="470" cy="368" r="8" fill="#A87418"/>
      <text x="538" y="390" fill="#52605B" font-size="18" text-anchor="middle">规划 · 生成 · 评审 · 精修</text>
    </g>

    <g id="language">
      <rect x="722" y="72" width="430" height="188" rx="10" fill="#FFFFFF" stroke="#CBD4CF"/>
      <text x="754" y="111" fill="#147862" font-size="18" font-weight="700">02 / 中英文工作台</text>
      <text x="754" y="153" fill="#18211E" font-size="30" font-weight="750">中文界面</text>
      <path d="M922 137H958" stroke="#147862" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="980" y="153" fill="#18211E" font-size="30" font-weight="750">EN 图内标签</text>
      <text x="754" y="195" fill="#52605B" font-size="20">切换界面语言不会改写论文内容、Prompt，</text>
      <text x="754" y="225" fill="#52605B" font-size="20">也不会改变生成图中的标签语言。</text>
    </g>

    <g id="dimensions">
      <rect x="722" y="284" width="430" height="188" rx="10" fill="#FFFFFF" stroke="#CBD4CF"/>
      <text x="754" y="323" fill="#A87418" font-size="18" font-weight="700">03 / 精确输出控制</text>
      <g fill="#18211E" font-size="22" font-weight="700">
        <text x="754" y="368">1:1</text>
        <text x="816" y="368">4:3</text>
        <text x="878" y="368">16:9</text>
        <text x="956" y="368">21:9</text>
      </g>
      <g fill="#F6F8F7" stroke="#CBD4CF">
        <rect x="754" y="389" width="102" height="48" rx="6"/>
        <rect x="870" y="389" width="102" height="48" rx="6"/>
        <rect x="986" y="389" width="132" height="48" rx="6"/>
      </g>
      <g fill="#18211E" font-size="22" font-weight="750" text-anchor="middle">
        <text x="805" y="421">1K</text>
        <text x="921" y="421">2K</text>
        <text x="1052" y="421">4K</text>
      </g>
      <text x="754" y="459" fill="#52605B" font-size="18">10 种比例 · 调用前能力校验 · 不静默裁切</text>
    </g>
  </g>
</svg>
